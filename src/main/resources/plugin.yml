name: ModularPacks
version: "${version}"
main: io.github.tootertutor.ModularPacks.ModularPacksPlugin
api-version: "1.21"
author: TooterTutor
description: A fully survival friendly backpack system complete with tiers and modules

commands:
  backpack:
    description: Main command for ModularPacks
    usage: /backpack <subcommand>
    aliases: [backpack]
    permission: modularpacks.command
permissions:
  modularpacks.command:
    default: true
  modularpacks.reload:
    default: op
  modularpacks.admin:
    default: op
  modularpacks.update.notify:
    default: op
  modularpacks.resourcepack.update.notify:
    default: op
  modularpacks.recipe:
    default: true

  modularpacks.place:
    default: true
  modularpacks.pickup:
    default: true
  modularpacks.open:
    default: true
